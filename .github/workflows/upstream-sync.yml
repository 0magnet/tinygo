# Keep this fork current with tinygo-org/tinygo: once a day, merge upstream dev
# into dev (which mirrors it) and into develop (which carries the 0magnet
# changes), and push develop only when the merge is clean and the compiler's
# own tests pass with it. A push to develop rebuilds the "toolchain" release.
#
# Anything else (a conflict, a failing test, a rejected push) opens an issue,
# or comments on the one already open, for a person or session to resolve.
#
# Scheduled runs use the workflow file on the default branch, dev, so that is
# the copy that counts; develop carries the same file so the two do not drift.
#
# GitHub turns scheduled workflows off after 60 days without activity in the
# repository; the pushes this makes count, but a quiet upstream does not.
#
# The push uses the SYNC_TOKEN secret when there is one, else the workflow's
# own token. The workflow token cannot push a merge that changes a file under
# .github/workflows, which upstream does now and then; SYNC_TOKEN, a token with
# the workflow scope, can. Without it such a merge is left unpushed and the
# issue says how to push it by hand.
name: Upstream sync

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Merge and test, but push nothing
        type: boolean
        default: false
      test_anyway:
        description: Run the tests even when there is nothing to merge
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
      LLVM: '23'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Fetch upstream
        id: fetch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/tinygo-org/tinygo.git
          git fetch --no-tags upstream dev
          git fetch --no-tags origin dev
          n=$(git rev-list --count HEAD..upstream/dev)
          echo "upstream/dev is $n commits ahead of develop"
          echo "behind=$n" >> "$GITHUB_OUTPUT"
          d=$(git rev-list --count origin/dev..upstream/dev)
          echo "upstream/dev is $d commits ahead of dev"
          echo "dev_behind=$d" >> "$GITHUB_OUTPUT"
      # dev mirrors upstream and this file is all it adds, so it never waits on
      # a develop conflict or test failure.
      - name: Push dev
        id: dev
        if: ${{ !inputs.dry_run && steps.fetch.outputs.dev_behind != '0' }}
        run: |
          git checkout -q -B dev origin/dev
          git merge --no-edit -m "Merge remote-tracking branch 'upstream/dev' into dev" upstream/dev
          if [ "$HAS_SYNC_TOKEN" != true ] && ! git diff --quiet origin/dev HEAD -- .github/workflows; then
            git diff --name-only origin/dev HEAD -- .github/workflows > "$RUNNER_TEMP/workflows-dev.txt"
            echo "::warning::dev not pushed, the workflow token cannot change $(paste -sd' ' "$RUNNER_TEMP/workflows-dev.txt")"
            echo "waiting=dev" >> "$GITHUB_OUTPUT"
          else
            git push origin dev
          fi
          git checkout -q develop
      - name: Merge upstream into develop
        if: steps.fetch.outputs.behind != '0'
        run: |
          if ! git merge --no-edit -m "Merge remote-tracking branch 'upstream/dev' into develop" upstream/dev; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "::error::merge conflicts in $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
            exit 1
          fi
      - uses: actions/setup-go@v6
        if: steps.fetch.outputs.behind != '0' || inputs.test_anyway
        with:
          go-version: stable
          cache: false
      - name: Install LLVM ${{ env.LLVM }}
        if: steps.fetch.outputs.behind != '0' || inputs.test_anyway
        run: |
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y llvm-$LLVM-dev clang-$LLVM libclang-$LLVM-dev lld-$LLVM liblld-$LLVM-dev
      # The compiler, interp and transform tests compile Go into LLVM IR and
      # check it, which needs the net submodule but none of the C libraries.
      # Programs are built and run by the Toolchain workflow's smoke test, and
      # by the projects that build with the toolchain.
      - name: Test
        if: steps.fetch.outputs.behind != '0' || inputs.test_anyway
        run: |
          git submodule update --init src/net
          go test -tags llvm$LLVM ./compiler ./interp ./transform ./compileopts
      - name: Push develop
        id: develop
        if: ${{ !inputs.dry_run && steps.fetch.outputs.behind != '0' }}
        run: |
          if [ "$HAS_SYNC_TOKEN" != true ] && ! git diff --quiet origin/develop HEAD -- .github/workflows; then
            git diff --name-only origin/develop HEAD -- .github/workflows > "$RUNNER_TEMP/workflows-develop.txt"
            echo "::warning::develop not pushed, the workflow token cannot change $(paste -sd' ' "$RUNNER_TEMP/workflows-develop.txt")"
            echo "waiting=develop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:develop
          # A push with the workflow token starts no workflow, so ask for
          # the toolchain explicitly. (With SYNC_TOKEN the push started one
          # too; the Toolchain workflow keeps only the newest of the two.)
          gh workflow run toolchain.yml --ref develop
      # Without SYNC_TOKEN a merge that changes a workflow file stays unpushed.
      - name: Report a merge that waits for a push
        if: ${{ !cancelled() && !inputs.dry_run && (steps.dev.outputs.waiting || steps.develop.outputs.waiting) }}
        env:
          WAITING: ${{ steps.dev.outputs.waiting }} ${{ steps.develop.outputs.waiting }}
        run: |
          title='Upstream sync needs a hand'
          files=$(sort -u "$RUNNER_TEMP"/workflows-*.txt | sed 's/.*/`&`/' | paste -sd, -)
          body="The [upstream sync]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) did not push its merge of tinygo-org/tinygo dev to: $WAITING. The merge changes $files, which the workflow token cannot push. Push it by hand from a clone with an upstream remote, or add a SYNC_TOKEN secret that can write workflows."
          for b in $WAITING; do
            body="$body"$'\n\n'"\`git fetch upstream dev && git checkout $b && git pull --ff-only origin $b && git merge --no-edit upstream/dev && git push origin $b\`"
          done
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Report the failure
        if: failure() && !inputs.dry_run
        run: |
          title='Upstream sync needs a hand'
          body="The [upstream sync]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) could not merge tinygo-org/tinygo dev into develop by itself."
          if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
            body="$body Conflicts: $(sed 's/.*/`&`/' "$RUNNER_TEMP/conflicts.txt" | paste -sd, -)."
          fi
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
